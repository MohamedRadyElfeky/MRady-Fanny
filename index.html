<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRady | Fanny - مركز التحميل</title>
    <!-- Tailwind CSS للتحكم في التصميم الاحترافي -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4">

<div class="glass w-full max-w-lg p-8 text-center shadow-2xl">
    <!-- Branding -->
    <div class="mb-6">
        <h1 class="text-3xl font-bold tracking-tight text-blue-400">MRady <span class="text-white">| Fanny</span></h1>
        <p class="text-gray-400 mt-2 text-sm">التحميل الذكي للتطبيق</p>
    </div>

    <div id="status-container">
        <!-- Loading State -->
        <div id="loading" class="space-y-4">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-700 h-12 w-12 mx-auto"></div>
            <p class="text-lg animate-pulse">جاري فحص توافق الجهاز...</p>
        </div>

        <!-- Result State (Hidden by default) -->
        <div id="result" class="hidden space-y-6">
            <div id="icon-success" class="bg-blue-500/20 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
            </div>
            <h2 id="msg-title" class="text-xl font-bold">تم العثور على النسخة المناسبة</h2>
            <p id="msg-desc" class="text-gray-400">بدأ التحميل التلقائي لإصدار <span id="ver-num" class="text-blue-300 font-mono">...</span></p>
            
            <a id="direct-link" href="#" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl transition-all transform hover:scale-105 shadow-lg shadow-blue-900/20">
                تحميل الآن يدويًا
            </a>
        </div>

        <!-- Fallback List (Hidden by default) -->
        <div id="fallback" class="hidden text-right space-y-4 mt-6 border-t border-white/10 pt-6">
            <p class="text-sm text-yellow-400 text-center">لم يتم التعرف على المعمارية بدقة، اختر النسخة المناسبة لجهازك:</p>
            <ul id="assets-list" class="space-y-2"></ul>
        </div>
    </div>
</div>

<script>
    // الإعدادات الخاصة بك بناءً على حسابك الظاهر في الصورة
    const CONFIG = {
        owner: 'mohamedradyelfeky',
        repo: 'MRady-Fanny',
        jsonPath: './version.json' // سيقرأ من ملفك الذي يتم تحديثه تلقائياً
    };

    async function initDownload() {
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const fallback = document.getElementById('fallback');
        const verNum = document.getElementById('ver-num');
        const directLink = document.getElementById('direct-link');
        const assetsList = document.getElementById('assets-list');

        try {
            // 1. محاولة جلب البيانات من ملف version.json أولاً لأنه يحتوي على تقسيم المعماريات
            const response = await fetch(CONFIG.jsonPath);
            if (!response.ok) throw new Error('JSON not found');
            const data = await response.json();

            verNum.innerText = data.latest_version;
            const userAgent = navigator.userAgent.toLowerCase();
            let targetUrl = null;

            // 2. منطق التوجيه الذكي بناءً على الجهاز والمعمارية
            if (userAgent.includes("android")) {
                // محاولة تحديد المعمارية إذا كانت متوفرة في الـ UserAgent (نادر ولكن ممكن)
                targetUrl = data.android_url || data.android_arm64_url;
            } else if (userAgent.includes("windows")) {
                targetUrl = data.windows_url;
            } else if (userAgent.includes("iphone") || userAgent.includes("ipad")) {
                targetUrl = data.ios_url;
            }

            loading.classList.add('hidden');
            result.classList.remove('hidden');

            if (targetUrl) {
                directLink.href = targetUrl;
                window.location.href = targetUrl;
            } else {
                // إذا لم نجد رابطاً مباشراً، نظهر القائمة بالكامل
                document.getElementById('msg-title').innerText = "اختر النسخة المناسبة";
                document.getElementById('msg-desc').innerText = "يرجى اختيار ملف التحميل المناسب لنوع هاتفك:";
                fallback.classList.remove('hidden');
                
                // بناء قائمة الروابط المتاحة
                const keys = {
                    'android_arm64_url': 'Android (ARM64)',
                    'android_arm_url': 'Android (ARMv7)',
                    'android_x86_64_url': 'Android (x86_64)',
                    'android_url': 'Android (Universal)',
                    'windows_url': 'Windows (exe)',
                    'ios_url': 'iOS (ipa)'
                };

                for (const [key, label] of Object.entries(keys)) {
                    if (data[key]) {
                        const li = document.createElement('li');
                        li.innerHTML = `<a href="${data[key]}" class="block p-3 bg-white/5 hover:bg-white/10 rounded-lg border border-white/5 transition-colors">📦 ${label}</a>`;
                        assetsList.appendChild(li);
                    }
                }
            }

        } catch (error) {
            console.error(error);
            loading.innerHTML = `
                <div class="text-red-400 mb-4">⚠️</div>
                <h2 class="text-xl font-bold">حدث خطأ في جلب البيانات</h2>
                <p class="text-gray-400 mt-2">تأكد من وجود ملف version.json أو قم بزيارة <a href="https://github.com/${CONFIG.owner}/${CONFIG.repo}/releases" class="text-blue-400 underline">صفحة الإصدارات</a></p>
            `;
        }
    }

    window.onload = initDownload;
</script>
</body>
</html>
