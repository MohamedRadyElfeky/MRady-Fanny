<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MR | Fanny Downloads</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
body{
font-family:'Tajawal',sans-serif;
background:
radial-gradient(circle at top right,#1d4ed8 0%,transparent 30%),
radial-gradient(circle at bottom left,#0891b2 0%,transparent 30%),
linear-gradient(135deg,#020617,#0f172a,#111827);
min-height:100vh;
color:white;
}

.glass{
background:rgba(255,255,255,.06);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
}

.card:hover{
transform:scale(1.02);
transition:.3s;
}
</style>

</head>

<body class="p-6">

<div class="max-w-5xl mx-auto">

<!-- Header -->
<div class="text-center mb-10">
<div class="text-5xl mb-3">📦</div>

<h1 class="text-3xl font-black text-blue-400">
MR | Fanny Downloads
</h1>

<p class="text-gray-400 mt-2">
اختر النسخة المناسبة لجهازك
</p>
</div>

<!-- Device -->
<div class="glass p-4 rounded-2xl text-center mb-8">
<p id="device" class="text-lg font-bold">جاري تحديد الجهاز...</p>
</div>

<!-- Container -->
<div id="container" class="grid md:grid-cols-2 gap-5"></div>

<!-- Error -->
<div id="error" class="hidden text-center mt-10">
<div class="text-5xl">⚠️</div>
<p class="text-red-400 mt-3 font-bold">لا توجد روابط متاحة</p>
</div>

</div>

<script>

function createCard(title, icon, desc, link){

const div = document.createElement("div");
div.className = "glass p-5 rounded-2xl card";

div.innerHTML = `
<h2 class="text-xl font-bold">${icon} ${title}</h2>
<a href="${link}" target="_blank" class="text-blue-400 mt-2 block">
تحميل
</a>
<p class="text-xs text-gray-400 mt-2">${desc || ""}</p>
`;

return div;
}

function getAndroidVersions(data){

const list = [];

if(data.android_arm64_url)
list.push({name:"ARM64 (v8)", url:data.android_arm64_url});

if(data.android_arm_url)
list.push({name:"ARM (v7)", url:data.android_arm_url});

if(data.android_x86_64_url)
list.push({name:"x86_64", url:data.android_x86_64_url});

if(data.android_url && list.length === 0)
list.push({name:"Universal", url:data.android_url});

return list;
}

async function load(){

try{

const res = await fetch("./version.json?v=" + Date.now());
const data = await res.json();

const ua = navigator.userAgent.toLowerCase();
let device = "Unknown Device";

const container = document.getElementById("container");
container.innerHTML = "";

// ---------------- ANDROID ----------------
if(ua.includes("android") || getAndroidVersions(data).length){

device = "Android";

const androidList = getAndroidVersions(data);

androidList.forEach(v=>{
container.appendChild(
createCard("Android", "🤖", v.name, v.url)
);
});
}

// ---------------- WINDOWS ----------------
if(data.windows_url){
device = "Windows";

container.appendChild(
createCard("Windows","🖥","EXE",data.windows_url)
);
}

// ---------------- iOS ----------------
if(data.ios_url){
device = "iOS";

container.appendChild(
createCard("iOS","🍎","App Store",data.ios_url)
);
}

// ---------------- DEVICE TEXT ----------------
document.getElementById("device").innerText =
"الجهاز المكتشف: " + device;

// ---------------- ERROR ----------------
if(!container.children.length){
document.getElementById("error").classList.remove("hidden");
}

}catch(e){
document.getElementById("error").classList.remove("hidden");
}

}

window.onload = load;

</script>

</body>
</html>
