<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MR | Fanny - Downloads</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
body{
font-family:'Tajawal',sans-serif;
background:
radial-gradient(circle at top right,#1d4ed8 0%,transparent 30%),
radial-gradient(circle at bottom left,#0891b2 0%,transparent 30%),
linear-gradient(135deg,#020617,#0f172a,#111827);
min-height:100vh;
color:white;
}

.glass{
background:rgba(255,255,255,.06);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
}

.card:hover{
transform:scale(1.02);
transition:.3s;
}
</style>

</head>

<body class="p-6">

<div class="max-w-5xl mx-auto">

<!-- Header -->
<div class="text-center mb-10">

<div class="text-5xl mb-3">📦</div>

<h1 class="text-3xl font-black text-blue-400">
MR | Fanny Downloads
</h1>

<p class="text-gray-400 mt-2">
اختر النسخة المناسبة لجهازك
</p>

</div>

<!-- Device Info -->
<div class="glass p-4 rounded-2xl text-center mb-8">

<p id="device" class="text-lg font-bold">
جاري تحديد الجهاز...
</p>

</div>

<!-- Cards -->
<div class="grid md:grid-cols-2 gap-5">

<!-- Android -->
<div class="glass p-5 rounded-2xl card">
<h2 class="text-xl font-bold">🤖 Android</h2>

<a id="android" class="text-blue-400 mt-2 block">تحميل APK</a>

<p class="text-xs text-gray-400 mt-2">ARM / ARM64 / x86</p>
</div>

<!-- Windows -->
<div class="glass p-5 rounded-2xl card">
<h2 class="text-xl font-bold">🖥 Windows</h2>

<a id="windows" class="text-blue-400 mt-2 block">تحميل EXE</a>
</div>

<!-- iOS -->
<div class="glass p-5 rounded-2xl card">
<h2 class="text-xl font-bold">🍎 iOS</h2>

<a id="ios" class="text-blue-400 mt-2 block">App Store / IPA</a>
</div>

<!-- Fallback -->
<div class="glass p-5 rounded-2xl card">
<h2 class="text-xl font-bold">📱 تحميل عام</h2>

<a id="fallback" class="text-blue-400 mt-2 block">تحميل مباشر</a>
</div>

</div>

<!-- Error -->
<div id="error" class="hidden text-center mt-10">

<div class="text-5xl">⚠️</div>

<p class="text-red-400 mt-3 font-bold">
لا توجد روابط متاحة
</p>

</div>

</div>

<script>

async function load(){

try{

const res = await fetch("./version.json?v=" + Date.now());
const data = await res.json();

const ua = navigator.userAgent.toLowerCase();

let device = "Unknown Device";
let link = null;

// Detect Device
if(ua.includes("android")){
device = "Android";
link = data.android_arm64_url || data.android_url || data.download_url;
}
else if(ua.includes("windows")){
device = "Windows";
link = data.windows_url || data.download_url;
}
else if(ua.includes("iphone") || ua.includes("ipad")){
device = "iOS";
link = data.ios_url || data.download_url;
}
else if(ua.includes("mac")){
device = "Mac";
link = data.download_url;
}
else{
device = "Unknown";
link = data.download_url;
}

// Show device
document.getElementById("device").innerText =
"الجهاز المكتشف: " + device;

// Set links safely (NO undefined EVER)
document.getElementById("android").href =
data.android_url || data.download_url;

document.getElementById("windows").href =
data.windows_url || data.download_url;

document.getElementById("ios").href =
data.ios_url || data.download_url;

document.getElementById("fallback").href =
data.download_url || "#";

// Auto redirect only if valid Android/iOS/Windows link exists
if(link){
setTimeout(()=>{
window.location.href = link;
},1500);
}

}catch(e){

document.getElementById("error").classList.remove("hidden");

}

}

window.onload = load;

</script>

</body>
</html>
